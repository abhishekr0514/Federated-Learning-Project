[project]
name = "medshield-flower-synthetic"
version = "0.1.0"
description = "MedShield synthetic infrastructure Flower app (non-clinical FedAvg smoke)"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "flwr>=1.30.0",
  "numpy>=1.26.0",
]

[tool.flwr.app]
publisher = "medshield"
fab-format-version = 1
flwr-version-target = "1.30.0"

[tool.flwr.app.components]
serverapp = "medshield_fl_app:server_app"
clientapp = "medshield_fl_app:client_app"

[tool.flwr.app.config]
num-server-rounds = 2
local-epochs = 1


